name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: >-
          uv run python -c "import py_compile, subprocess;
          files=subprocess.check_output(['git','ls-files','*.py'], text=True).splitlines();
          [py_compile.compile(path, doraise=True) for path in files]
          "

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest

      - name: Check whitespace errors
        run: git diff --check
